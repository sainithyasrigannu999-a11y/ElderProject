{% extends 'base.html' %}
{% block title %}Login | ElderGuard AI{% endblock %}
{% block content %}
<div class="container py-5">
  <div class="row justify-content-center">
    <div class="col-md-6">
      <div class="auth-card">
        <h2 class="text-center mb-4">Login</h2>
        <form method="post">
          <div class="mb-3">
            <label for="email" class="form-label">Email</label>
            <input type="email" class="form-control form-control-lg" id="email" name="email" required>
          </div>
          <div class="mb-3">
            <label for="password" class="form-label">Password</label>
            <input type="password" class="form-control form-control-lg" id="password" name="password" required>
          </div>
          <div class="mb-3">
            <label for="role" class="form-label">Role</label>
            <select class="form-select form-select-lg" id="role" name="role">
              <option value="elderly">Elderly User</option>
              <option value="caregiver">Caregiver</option>
            </select>
          </div>
          <button type="submit" class="btn btn-primary btn-lg w-100">Login</button>
        </form>
        <p class="text-center mt-3 mb-0">Need an account? <a href="{{ url_for('register') }}">Register here</a></p>
      </div>
    </div>
  </div>
</div>
{% endblock %}
