{% extends 'base.html' %}
{% block title %}Profile{% endblock %}
{% block content %}
<div class="container py-5">
  <div class="row justify-content-center">
    <div class="col-lg-8">
      <div class="auth-card">
        <h2 class="text-center mb-4">Profile Settings</h2>
        <form method="post">
          <div class="row g-3">
            <div class="col-md-6">
              <label class="form-label">Name</label>
              <input class="form-control form-control-lg" type="text" name="name" value="{{ user.name }}">
            </div>
            <div class="col-md-6">
              <label class="form-label">Phone</label>
              <input class="form-control form-control-lg" type="tel" name="phone" value="{{ user.phone }}">
            </div>
            <div class="col-md-6">
              <label class="form-label">Age</label>
              <input class="form-control form-control-lg" type="number" name="age" value="{{ user.age }}">
            </div>
            <div class="col-md-6">
              <label class="form-label">Gender</label>
              <select class="form-select form-select-lg" name="gender">
                <option value="Female" {% if user.gender == 'Female' %}selected{% endif %}>Female</option>
                <option value="Male" {% if user.gender == 'Male' %}selected{% endif %}>Male</option>
                <option value="Other" {% if user.gender == 'Other' %}selected{% endif %}>Other</option>
              </select>
            </div>

            {% if user.role == 'elderly' %}
            <div class="col-md-6">
              <label class="form-label">Caregiver Email</label>
              <input class="form-control form-control-lg" type="email" name="caregiver_email" placeholder="caregiver@example.com">
            </div>
            <div class="col-md-6">
              <label class="form-label">Caregiver Phone</label>
              <input class="form-control form-control-lg" type="tel" name="caregiver_phone" placeholder="5550000000">
            </div>
            <div class="col-md-12">
              <label class="form-label">Caregiver Name (optional)</label>
              <input class="form-control form-control-lg" type="text" name="caregiver_name" placeholder="Caregiver full name">
            </div>
            {% endif %}

            <div class="col-md-12">
              <label class="form-label">New Password (optional)</label>
              <input class="form-control form-control-lg" type="password" name="password">
            </div>
          </div>
          <button class="btn btn-primary btn-lg w-100 mt-4" type="submit">Update Profile</button>
        </form>
      </div>
    </div>
  </div>
</div>
{% endblock %}
